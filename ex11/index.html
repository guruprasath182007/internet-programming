<!DOCTYPE html>
<html>
<head>
    <title>Shopping Order System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f5fc4;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Shopping Order</h1>

    <div class="subtitle">
        Enter your order details
    </div>

    <form action="process.php" method="POST">

        <label>Customer Name</label>

        <input
            type="text"
            name="customer_name"
            placeholder="Enter customer name"
            required
        >

        <label>Product Name</label>

        <input
            type="text"
            name="product_name"
            placeholder="Enter product name"
            required
        >

        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            min="1"
            placeholder="Enter quantity"
            required
        >

        <label>Price</label>

        <input
            type="number"
            name="price"
            min="0"
            step="0.01"
            placeholder="Enter price"
            required
        >

        <button type="submit" name="submit">
            Place Order
        </button>

    </form>

</div>

</body>
</html>
