<!DOCTYPE html>
<html>
<head>
    <title>Place Order - ShopEasy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dfe6ee);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #111827;
            color: white;
            padding: 18px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        /* Main */
        .page {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 55px 20px;
        }

        .order-box {
            width: 500px;
            background: white;
            padding: 35px 40px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .order-box h1 {
            text-align: center;
            margin: 0;
            color: #111827;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin: 8px 0 30px;
            font-size: 14px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        /* Button */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* Footer link */
        .view-orders {
            text-align: center;
            margin-top: 22px;
        }

        .view-orders a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .view-orders a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            header {
                padding: 18px 25px;
            }

            .order-box {
                width: 100%;
                padding: 30px 25px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>

    <h2>ShopEasy</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="order.html">Place Orders</a>
        <a href="view_orders.php">View Orders</a>
    </nav>

</header>

<div class="page">

    <div class="order-box">

        <h1>Place Your Order</h1>

        <p class="subtitle">
            Enter the product details to place your order
        </p>

        <form action="insert_order.php" method="POST">

            <div class="form-group">
                <label>Customer Name</label>
                <input
                    type="text"
                    name="customer_name"
                    placeholder="Enter your name"
                    required>
            </div>

            <div class="form-group">
                <label>Product Name</label>
                <input
                    type="text"
                    name="product_name"
                    placeholder="Enter product name"
                    required>
            </div>

            <div class="row">

                <div class="form-group">
                    <label>Quantity</label>
                    <input
                        type="number"
                        name="quantity"
                        placeholder="Quantity"
                        min="1"
                        required>
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input
                        type="number"
                        name="price"
                        placeholder="Price"
                        min="0"
                        step="0.01"
                        required>
                </div>

            </div>

            <button type="submit">
                PLACE ORDER
            </button>

        </form>

        <div class="view-orders">
            <a href="view_orders.php">
                View All Orders →
            </a>
        </div>

    </div>

</div>

</body>
</html>
