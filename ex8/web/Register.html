<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 470px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 50%;
            background: #667eea;
            color: white;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin: 12px 0 5px;
            color: #222;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .field {
            flex: 1;
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .button:hover {
            background: #5568d8;
        }

        .note {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="header">
        <h1>Create Account</h1>
        <div class="subtitle">Enter your details to register</div>
    </div>

    <form action="register.jsp" method="post">

        <div class="row">

            <div class="field">
                <label>User Name</label>
                <input type="text"
                       name="username"
                       placeholder="Enter username"
                       required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Enter password"
                       required>
            </div>

        </div>

        <div class="field">
            <label>Full Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>
        </div>

        <div class="field">
            <label>Credit Card Number</label>
            <input type="text"
                   name="ccnumber"
                   placeholder="13 - 19 digits"
                   pattern="\d{13,19}"
                   maxlength="19"
                   required>
        </div>

        <div class="row">

            <div class="field">
                <label>Email</label>
                <input type="email"
                       name="email"
                       placeholder="example@mail.com"
                       required>
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input type="tel"
                       name="phone"
                       placeholder="10 digit number"
                       pattern="[0-9]{10}"
                       required>
            </div>

        </div>

        <input class="button" type="submit" value="Create Account">

    </form>

    <div class="note">
        All fields are required
    </div>

</div>

</body>
</html>
